<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Sodimac</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <script>
    /*
     * Teclado físico — deshabilita el teclado virtual en plataformas nativas.
     * MutationObserver intercepta cada <input>/<textarea> (nativos o ion-input)
     * antes de que Android pueda reaccionar al focus, usando inputmode="none".
     * El observer vive antes de Angular para cubrir también los elementos
     * generados durante el bootstrap inicial.
     */
    (function () {
      if (!window.Capacitor || !window.Capacitor.isNativePlatform()) return;

      var SELECTOR = 'ion-input, input, textarea';

      function marcarInput(el) {
        if (el && el.setAttribute && el.getAttribute('inputmode') !== 'none') {
          el.setAttribute('inputmode', 'none');
          // ion-input crea su <input> nativo dentro del shadow DOM: míralo también ahí
          if (el.shadowRoot) {
            el.shadowRoot.querySelectorAll('input, textarea').forEach(marcarInput);
          }
        }
      }

      function escanear(root) {
        if (!root) return;
        root.querySelectorAll(SELECTOR).forEach(marcarInput);
        // host de ion-input cuyo shadow DOM ya se montó
        root.querySelectorAll('ion-input').forEach(function (h) {
          if (h.shadowRoot) {
            h.shadowRoot.querySelectorAll('input, textarea').forEach(marcarInput);
          }
        });
      }

      function internoActivo() {
        var el = document.activeElement;
        var guard = 0;
        while (el && el.shadowRoot && el.shadowRoot.activeElement && guard++ < 8) {
          el = el.shadowRoot.activeElement;
        }
        return (el && el.matches && el.matches('input, textarea')) ? el : null;
      }

      // Captura el focus: marca el <input> interno real justo antes de que
      // Android decida mostrar el teclado, aunque Angular haya re-aplicado
      // inputmode="text" tras un re-render.
      document.addEventListener('focusin', function () {
        var interno = internoActivo();
        if (interno) marcarInput(interno);
      }, true);

      var observer = new MutationObserver(function (mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var m = mutations[i];
          if (m.type === 'attributes') {
            marcarInput(m.target);
            continue;
          }
          var added = m.addedNodes;
          for (var j = 0; j < added.length; j++) {
            var node = added[j];
            if (node.nodeType !== 1) continue;
            if (node.matches && node.matches(SELECTOR)) marcarInput(node);
            if (node.querySelectorAll) escanear(node);
          }
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        escanear(document.body);
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ['inputmode']
        });
      });
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
