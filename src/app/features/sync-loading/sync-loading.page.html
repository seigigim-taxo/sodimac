<ion-content class="[&::part(background)]:bg-none" style="--background: var(--app-bg-gradient);">
  <div class="flex flex-col items-center justify-center min-h-full max-w-[420px] mx-auto px-8 gap-10">

    <div class="text-center">
      <p class="text-[11px] font-bold tracking-[0.18em] uppercase mb-2" style="background: linear-gradient(90deg, #E6126A, #BF24A0, #35BEE8); -webkit-background-clip: text; background-clip: text; color: transparent;">Sodimac</p>
      <h1 class="text-2xl font-extrabold tracking-tight" style="color: var(--app-text);">Control de inventario</h1>
    </div>

    <div class="sync-body">
      @if (error(); as mensaje) {
        <p class="sync-step-label">{{ mensaje }}</p>
        <ion-button expand="block" (click)="reintentar()">Reintentar</ion-button>
        <!--
          Salida obligatoria: si la descarga no puede completarse —sin red, o
          el operador no tiene tienda asignada— "Reintentar" no lleva a ningún
          lado y esta pantalla queda sin salida. Pasa a ser mucho más frecuente
          desde que el login manda acá cuando los datos no son del día.
        -->
        <ion-button expand="block" fill="clear" (click)="cerrarSesion()">
          Cerrar sesión
        </ion-button>
      } @else {
        <p class="sync-step-label">{{ etiqueta() }}</p>

        <ion-progress-bar
          [value]="progress() / 100"
          style="width: 100%; height: 8px; border-radius: 9999px; --background: var(--app-border); --progress-background: var(--app-info);"
        ></ion-progress-bar>

        <p class="sync-percent">{{ progress() | number:'1.0-0' }}%</p>
      }
    </div>

  </div>
</ion-content>
