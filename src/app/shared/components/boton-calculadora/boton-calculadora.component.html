<!--
  Misma tarjeta flotante centrada que el buscador de SKU: una utilidad de
  paso, no un flujo que tape la pantalla de conteo.

  keepContentsMounted: sin esto, Ionic destruye CalculadoraComponent al
  cerrar el modal y lo recrea desde cero al reabrir — el número en curso se
  perdía en cada cierre, aunque el componente asumía que sobrevivía.
-->
<ion-modal class="buscador-modal" [isOpen]="abierto()" [keepContentsMounted]="true"
  (ionModalDidDismiss)="cerrarCalculadora()">
  <ng-template>
    <div class="buscador-tarjeta">
      <div class="flex items-center justify-between gap-3 mb-3">
        <p class="buscador-titulo">Calculadora</p>
        <button type="button" class="buscador-cerrar" (click)="cerrarCalculadora()"
          aria-label="Cerrar calculadora">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>

      <app-calculadora></app-calculadora>
    </div>
  </ng-template>
</ion-modal>
