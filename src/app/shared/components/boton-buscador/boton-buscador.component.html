<!--
  Tarjeta flotante centrada, no una hoja desde abajo: la búsqueda es una
  consulta de paso —mirar dónde se contó algo y volver—, y el centro deja ver
  que la pantalla de conteo sigue detrás.
-->
<ion-modal class="buscador-modal" [isOpen]="abierto()"
  (ionModalDidDismiss)="cerrarBuscador()">
  <ng-template>
    <div class="buscador-tarjeta">
      <div class="flex items-center justify-between gap-3 mb-3">
        <p class="buscador-titulo">Buscar SKU</p>
        <button type="button" class="buscador-cerrar" (click)="cerrarBuscador()"
          aria-label="Cerrar buscador">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>

      <app-buscador-sku></app-buscador-sku>
    </div>
  </ng-template>
</ion-modal>
